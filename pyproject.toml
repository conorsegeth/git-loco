[project]
name = "git-loco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.11.3",
    "typer>=0.27.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
git-loco = "git_loco.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_loco"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
